name: CI

on:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [ '23', '18' ]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Pin npm registry to the release-time state
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-02-11T03:49:52.301Z

    - run: npm install

    - name: Test
      # Run mocha directly, without the c8 coverage gate: V8 coverage
      # instrumentation pushes the pathological speed tests past their timeout
      run: npm run lint && CJS_ONLY=1 npm run build && npx mocha && node support/specsplit.mjs

    - name: Build release bundles
      if: matrix.node-version == '23'
      run: npm run build

    - name: Pack tarball
      if: matrix.node-version == '23'
      run: npm pack

    - name: Upload package tarball
      if: matrix.node-version == '23'
      uses: actions/upload-artifact@v4
      with:
        name: markdown-it-tarball
        path: markdown-it-*.tgz
        if-no-files-found: error
